spring:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ${FILE_UPLOADS_DIR:uploads}

  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework

youtube:
  api:
    key: AIzaSyBnoAupUJ6oVyeEgnFKuMzOQ-R4XBxXZDk
    channel-id: UCqFOHLSg-jmCS__QRZgmqXw

debug: false

logging:
  level:
    root: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"

basicdata:
  file-path: ./data/basic-data.json

files:
  file-path: ./data/pdf_files

requiredinformation:
  file-path: ./data/required-information.json

entrance-exam:
  file-path: ./data/entrance-exam.json

title-and-content:
  file-path: ./data/title-and-content.json

app:
  search:
    siteDomain: zusdh.cz

