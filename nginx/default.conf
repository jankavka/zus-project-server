# /etc/nginx/conf.d/default.conf (mounted from ./nginx/nginx.conf)

# HTTPS virtual host
server {
  listen 80;
  server_name kavka-test.ddns.net;

  # Let’s Encrypt ACME challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  
  location / {
    return 301 https://$host$request_uri;
  }

  location = /healthz {
   return 200 "ok";
   add_header Content-Type text/plain;
  }

}
  


server {
  listen 443 ssl;
  http2 on;
  server_name kavka-test.ddns.net;

   # Let’s Encrypt ACME challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  ssl_certificate     /etc/letsencrypt/live/kavka-test.ddns.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kavka-test.ddns.net/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50M;

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }


  # ---- API proxy ----
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_redirect off;
  }

  # (If you have this endpoint separately)
  location /search {
    proxy_pass http://backend:8080/search;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_redirect off;
  }

  # ---- FILES / PHOTOS (this fixes your /uploads/* URL) ----
  # Proxy raw file URLs to the backend which serves from FILE_UPLOADS_DIR
  location /uploads/ {
   proxy_pass http://backend:8080/uploads/;
   proxy_set_header Host              $host;
   proxy_set_header X-Real-IP         $remote_addr;
   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-Host  $host;
   proxy_set_header X-Forwarded-Port  $server_port;
   proxy_redirect off;
  }

  # ---- CAROUSEL PHOTOS ----
  # Proxy raw file URLs to the backend which serves from CAROUSEL_UPLOADS_DIR
  location /carousel-photos/ {
   proxy_pass http://backend:8080/carousel-photos/;
   proxy_set_header Host              $host;
   proxy_set_header X-Real-IP         $remote_addr;
   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-Host  $host;
   proxy_set_header X-Forwarded-Port  $server_port;
   proxy_redirect off;
  }

  # ---- SPA fallback (keeps /admin etc. working) ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# INTERNÍ health server jen pro Docker healthcheck
server {
  listen 127.0.0.1:8080;
  server_name _;

  location = / {
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}

