# /etc/nginx/conf.d/default.conf (mounted from ./nginx/ip-only.conf via docker-compose.override.yml)
# Interim config for the phase before zusdh.cz DNS cutover: plain HTTP on the
# server's bare IP, no SSL/ACME/certbot. Mirrors default.conf's proxy rules.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50M;

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  # ---- API proxy ----
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_redirect off;
  }

  location /search {
    proxy_pass http://backend:8080/search;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_redirect off;
  }

  # ---- FILES / PHOTOS ----
  location /uploads/ {
   proxy_pass http://backend:8080/uploads/;
   proxy_set_header Host              $host;
   proxy_set_header X-Real-IP         $remote_addr;
   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-Host  $host;
   proxy_set_header X-Forwarded-Port  $server_port;
   proxy_redirect off;
  }

  # ---- CAROUSEL PHOTOS ----
  location /carousel-photos/ {
   proxy_pass http://backend:8080/carousel-photos/;
   proxy_set_header Host              $host;
   proxy_set_header X-Real-IP         $remote_addr;
   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-Host  $host;
   proxy_set_header X-Forwarded-Port  $server_port;
   proxy_redirect off;
  }

  # ---- SPA fallback (keeps /admin etc. working) ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# INTERNAL health server for the Docker healthcheck (frontend healthcheck in
# docker-compose.yml curls 127.0.0.1:8080 inside the container)
server {
  listen 127.0.0.1:8080;
  server_name _;

  location = / {
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
